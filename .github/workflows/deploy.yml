name: Deploy to Stores

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggering
    inputs:
      ios_signing_check:
        description: 'Build and sign the iOS app without uploading it'
        type: boolean
        default: false

jobs:
  github-release:
    name: Publish APK to GitHub Releases
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'

      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          bundle install

      - name: Prepare signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or not set"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/github-release.keystore
          printf '%s\n' \
            "storeFile=app/github-release.keystore" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" > android/key.properties

      - name: Build release APK
        run: |
          cd android
          bundle exec fastlane build

      - name: Verify signature
        shell: bash
        run: |
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          if grep -q "Android Debug" <<<"$certs"; then
            echo "::error::Release APK is signed with the Android debug certificate"
            exit 1
          fi
          grep "certificate SHA-256 digest" <<<"$certs"

      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd android
          bundle exec fastlane github_release

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/github-release.keystore

  play-alpha:
    name: Publish app bundle to Google Play Alpha
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'

      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Check changelogs
        shell: bash
        run: |
          code=$(ruby fastlane/version_from_tag.rb | tail -n 1)
          for locale in de-DE en-US; do
            file="android/fastlane/metadata/android/$locale/changelogs/$code.txt"
            if [ ! -s "$file" ]; then
              echo "::error::Changelog for version code $code is missing or empty: $file"
              exit 1
            fi
          done

      - name: Install dependencies
        run: |
          flutter pub get
          bundle install

      - name: Make store pictures
        run: |
          cd android
          bundle exec fastlane store_pictures

      - name: Check store pictures
        shell: bash
        run: |
          shopt -s nullglob
          for locale in de-DE en-US; do
            pictures=("android/fastlane/metadata/android/$locale/images/phoneScreenshots"/*store-*.png)
            if [ "${#pictures[@]}" -lt 2 ]; then
              echo "::error::Locale $locale has ${#pictures[@]} store pictures, Play needs at least 2"
              exit 1
            fi
          done

      - name: Prepare signing and Play credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or not set"
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/play-upload.keystore"
          json_key="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$json_key"
          printf '%s\n' \
            "storeFile=$keystore" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
          echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH=$json_key" >> "$GITHUB_ENV"

      - name: Build and upload app bundle
        run: |
          cd android
          bundle exec fastlane alpha

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/play-upload.keystore" "$RUNNER_TEMP/play-service-account.json"

  testflight:
    name: Upload iOS build to TestFlight
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.ios_signing_check)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'

      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Print Xcode and iOS SDK version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare App Store Connect key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or not set"
              exit 1
            fi
          done
          umask 077
          key="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          if ! grep -q -e '-----BEGIN PRIVATE KEY-----' "$key"; then
            echo "::error::ASC_KEY_P8 is not a base64 encoded .p8 private key"
            exit 1
          fi
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_LANE: ${{ github.event_name == 'push' && 'beta' || 'signing_check' }}
        run: |
          cd ios
          bundle exec fastlane "$IOS_LANE"

      - name: Remove App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8"
