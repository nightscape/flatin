# The form differences the oracle accepts, each with the reason it is the
# Collatinus data's and not ours. Any other form difference fails the run;
# so does an entry that covers no difference any more. An entry covers a
# difference when every field it names matches. In `keys`, `*` stands for
# one segment. `synthetic: true` limits an entry to the items the sample made
# up from Collatinus lemmas; those give no comparison parts.

- keys: [adv.komp]
  item: bonus
  reason: "the Collatinus model `adve` grades the adverb regularly and ignores the suppletive radicals of its lemma"
- keys: [adv.sup]
  item: bonus
  reason: "the Collatinus model `adve` grades the adverb regularly and ignores the suppletive radicals of its lemma"

- keys: ["*.*.*.komp"]
  types: [Adjektiv-a-o, Adjektiv-a-o-er, Adjektiv-dreiendig]
  synthetic: true
  reason: "a sampled adjective names no comparative, so we grade regularly (-ior); Collatinus uses the suppletive radicals of magnus, malus, parvus and writes the comparative of a lemma without radicals as -or/-us (lānigerior against lānĭgĕrŏr)"
- keys: ["*.*.*.sup"]
  types: [Adjektiv-a-o]
  synthetic: true
  reason: "a sampled adjective names no superlative, so we grade regularly; Collatinus uses the suppletive radicals of magnus, malus, parvus"

- keys: [imp.fut.akt.3.pl]
  types: [I-Konjugation, Mischkonjugation]
  reason: "the Collatinus models `audio` and `capio` leave this morph to `lego`, which drops the stem i (capiuntō against căpūntō)"

- keys: [imp.praes.pass.2.sg, imp.fut.akt.2.sg, imp.fut.akt.3.sg, imp.fut.akt.2.pl]
  item: ferre
  reason: "the Collatinus model `fero` does not override these morphs of `lego`, so it keeps the unsyncopated forms"
- keys: [ind.praes.pass.2.sg, imp.praes.pass.2.sg, imp.fut.akt.2.sg, imp.fut.akt.3.sg, imp.fut.akt.2.pl]
  item: afferre
  reason: "Collatinus files the syncopated ferris as an irregular of `fero` alone, and `fero` leaves the other two morphs to `lego`, so the compound keeps the unsyncopated forms"
