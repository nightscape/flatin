# The code "sg" is declared by two axes, which S1 forbids.
axes:
  numerus:
    name: {de: Numerus, en: Number}
    values:
      sg: {de: Singular, en: Singular}
      pl: {de: Plural, en: Plural}
  genus:
    name: {de: Genus, en: Gender}
    values:
      sg: {de: Singular, en: Singular}
      f: {de: Femininum, en: Feminine}

label:
  head: []
  tail: [numerus, genus]
  merge_axis: numerus
