      ind.praes.akt.1.sg: "{praesens}ō"
      ind.praes.akt.2.sg: "{praesens}is"
      ind.praes.akt.3.sg: "{praesens}it"
      ind.praes.akt.1.pl: "{praesens}imus"
      ind.praes.akt.2.pl: "{praesens}itis"
      ind.praes.akt.3.pl: "{praesens}unt"
      ind.impf.akt.1.sg: "{praesens}ēbam"
      ind.impf.akt.2.sg: "{praesens}ēbās"
      ind.impf.akt.3.sg: "{praesens}ēbat"
      ind.impf.akt.1.pl: "{praesens}ēbāmus"
      ind.impf.akt.2.pl: "{praesens}ēbātis"
      ind.impf.akt.3.pl: "{praesens}ēbant"
      ind.fut.akt.1.sg: "{praesens}am"
      ind.fut.akt.2.sg: "{praesens}ēs"
      ind.fut.akt.3.sg: "{praesens}et"
      ind.fut.akt.1.pl: "{praesens}ēmus"
      ind.fut.akt.2.pl: "{praesens}ētis"
      ind.fut.akt.3.pl: "{praesens}ent"
      konj.praes.akt.1.sg: "{praesens}am"
      konj.praes.akt.2.sg: "{praesens}ās"
      konj.praes.akt.3.sg: "{praesens}at"
