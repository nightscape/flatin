      inf.praes.pass: "{praesens}ī"

  esse-Typ:
    class: konjugation
    display: {de: esse-Typ, en: esse type}
    inherits_from: Perfekt-System
    stems:
      pfa: {from: futurpartizip, remove: "us", display: {de: PFA-Stamm, en: Future participle stem}}
    delegate:
      - {name: pfa, type: a-o-Endungen, bind: {stamm: pfa}, set: {modus: part, tempus: fut, genus_verbi: akt}}

  Unregelmäßig:
    class: konjugation
    display: {de: Unregelmäßig, en: irregular}
    inherits_from: Verb-Basis
    stems:
      ppa:     {from: ppa_gen, remove: "is", display: {de: PPA-Stamm, en: Present participle stem}}
      ppa_nom: {from: ppa_nom, remove: "", display: {de: PPA Nominativ, en: Present participle nominative}}
      gerv:    {from: gerundiv, remove: "us", display: {de: Gerundivstamm, en: Gerundive stem}}
      # Only a Kompositum of esse gives these two parts; without them the
      # rules below produce no key (S4), and the other items stay untouched.
      praefix:  {from: praefix, display: {de: Präfix, en: Prefix}}
      praesens: {from: praesens_stamm, display: {de: Präsensstamm, en: Present stem}}
    sandhi: [t_s]
    compose:
      - match: {modus: ind, tempus: [praes, impf, fut]}
        parts:
          - {stem: praefix}
          - {lexeme: esse, pass: all}
      - match: {modus: konj, tempus: praes}
        parts:
          - {stem: praefix}
          - {lexeme: esse, pass: all}
    forms:
      # pot- + essem contracts to possem, which no seam rule can write.
      konj.impf.akt.1.sg: "{praesens}sem"
      konj.impf.akt.2.sg: "{praesens}sēs"
      konj.impf.akt.3.sg: "{praesens}set"
      konj.impf.akt.1.pl: "{praesens}sēmus"
      konj.impf.akt.2.pl: "{praesens}sētis"
      konj.impf.akt.3.pl: "{praesens}sent"
      inf.praes.akt: "{praesens}se"

  esse-Kompositum:
    class: konjugation
    display: {de: esse-Kompositum, en: compound of esse}
    inherits_from: Perfekt-System
    stems:
      praefix: {from: praefix, remove: "", display: {de: Präfix, en: Prefix}}
    compose:
      - match: {tempus: [praes, impf, fut]}
        join: ""
        parts: [{stem: praefix}, {lexeme: esse, pass: all}]
    sandhi: [d_ausfall]

  ire-Kompositum:
    class: konjugation
    display: {de: ire-Kompositum, en: ire-Kompositum}
    stems:
      praefix: {from: praefix, remove: "", display: {de: Präfix, en: Prefix}}
    compose:
      - match: {}
        join: ""
        parts: [{stem: praefix}, {lexeme: ire, pass: all}]

  ferre-Kompositum:
    class: konjugation
    display: {de: ferre-Kompositum, en: ferre-Kompositum}
    stems:
      praefix: {from: praefix, remove: "", display: {de: Präfix, en: Prefix}}
    compose:
      - match: {}
        join: ""
        parts: [{stem: praefix}, {lexeme: ferre, pass: all}]
    sandhi: [d_angleich]

