    display: {de: Mischkonjugation, en: "mixed conjugation (3rd -iō)"}
    inherits_from: I-Konjugation
    stems:
      wurzel:   {from: praesens_1sg, remove: ["iō", "ior"], display: {de: Wurzel, en: Root}}
      praesens: {template: "{wurzel}i", display: {de: Präsensstamm, en: Present stem}}
      perfekt:  {from: perfekt_1sg, remove: "ī", display: {de: Perfektstamm, en: Perfect stem}}
      ppp:      {from: supinum, remove: "um", display: {de: PPP-Stamm, en: PPP stem}}
    sandhi: [i_ausfall, i_e_r, i_e_auslaut]
    forms:
      inf.praes.pass: "{praesens}ī"
  Konsonantische:
    class: konjugation
    display: {de: Konsonantische, en: "3rd conjugation"}
    inherits_from: Verb-Vollständig
    stems:
      praesens: {from: praesens_1sg, remove: ["ō", "or"], display: {de: Präsensstamm, en: Present stem}}
      ppa:      {template: "{praesens}ent", display: {de: PPA-Stamm, en: Present participle stem}}
      ppa_nom:  {template: "{praesens}ēns", display: {de: PPA Nominativ, en: Present participle nominative}}
      gerv:     {template: "{praesens}end", display: {de: Gerundivstamm, en: Gerundive stem}}
