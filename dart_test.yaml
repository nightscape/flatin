tags:
  # The oracle needs third-party data that is not in the repo, so it is skipped
  # by default and run with
  #   tool/oracle/run.sh
  # `exclude_tags` would be simpler but `flutter test --tags oracle` is unioned
  # with it, which leaves no way to run the oracle at all.
  oracle:
    skip: "run tool/oracle/run.sh"

  # The pair sweep takes minutes, so it is skipped by default and run with
  #   flutter test --tags sweep --run-skipped
  sweep:
    skip: "run flutter test --tags sweep --run-skipped"

  # Needs a private paradigm file: see test/printed/README.md. The group
  # skips itself unless PRINTED_PARADIGMS is set.
  printed: {}
