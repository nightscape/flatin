data_file_id: verbs

axes:
  modus:       {name: Modus, values: {ind: Indikativ, konj: Konjunktiv, imp: Imperativ, inf: Infinitiv, part: Partizip, ger: Gerundium, gerv: Gerundivum, sup: Supinum}, hidden_in_label: [ind]}
  tempus:      {name: Tempus, values: {praes: Präsens, impf: Imperfekt, fut: Futur I, perf: Perfekt, plusq: Plusquamperfekt, fut2: Futur II}}
  genus_verbi: {name: Genus verbi, values: {akt: Aktiv, pass: Passiv}, hidden_in_label: [akt]}
  person:      {name: Person, values: {"1": 1. Person, "2": 2. Person, "3": 3. Person}}
  numerus:     {name: Numerus, values: {sg: Singular, pl: Plural}}
  kasus:       {name: Kasus, values: {nom: Nominativ, gen: Genitiv, dat: Dativ, akk: Akkusativ, abl: Ablativ, vok: Vokativ}}
  genus:       {name: Genus, values: {m: maskulin, f: feminin, n: neutrum}}

label:
  head: [modus, tempus, genus_verbi]
  tail: [person, numerus, kasus, genus]
  merge_axis: person

parts:
  praesens_1sg:   {label: "1. Person Singular"}
  infinitiv:      {label: Infinitiv}
  perfekt_1sg:    {label: Perfekt}
  supinum:        {label: Supinum}
  praefix:        {label: Präfix, display: false}
  futurpartizip:  {label: Partizip Futur}
  ppa_nom:        {label: Partizip Präsens}
  ppa_gen:        {label: Partizip Präsens Genitiv}
  gerundiv:       {label: Gerundivum}

defaults:
  given_part: praesens_1sg
  lemma_part: infinitiv

type_inference:
  infinitiv:
    - {suffix: "ārī", types: [A-Konjugation]}
    - {suffix: "āre", types: [A-Konjugation]}
    - {suffix: "ērī", types: [E-Konjugation]}
    - {suffix: "ēre", types: [E-Konjugation]}
    - {suffix: "īrī", types: [I-Konjugation]}
    - {suffix: "īre", types: [I-Konjugation]}
    - {suffix: "are", min_length: 5, types: [A-Konjugation]}
    - {suffix: "ere", min_length: 5, types: [Konsonantische, Mischkonjugation, E-Konjugation]}

sandhi:
  t_s:         {end: t, before: [s], replace: s, explain: "t wird vor s zu s"}
  d_ausfall:   {end: d, before: consonant, replace: "", explain: "d fällt vor Konsonant aus"}
  d_angleich:  {end: d, before: [f, l, t], replace: double_next, explain: "d gleicht sich an"}
  a_ausfall:   {end: a, before: vowel, replace: "", explain: "ā fällt vor Vokal aus"}
  vokal_kurz:  {end: vowel, before: vowel, replace: short, explain: "Vokal vor Vokal wird kurz"}
  kurz_nt:     {end: vowel, before: [nt, nd], replace: short, explain: "Vokal vor nt/nd wird kurz"}
  kurz_t:      {end: vowel, before: ["t$"], replace: short, explain: "Vokal vor -t am Wortende wird kurz"}
  i_ausfall:   {end: i, before: [i], replace: "", explain: "i fällt vor ī aus"}
  i_e_r:       {end: i, before: [r], replace: e, explain: "i wird vor r zu e"}
  i_e_auslaut: {end: i, before: ["$"], replace: e, explain: "i wird am Wortende zu e"}

types:
  Perfekt-System:
    abstract: true
    stems:
      perfekt: {from: perfekt_1sg, remove: "ī", display: Perfektstamm}
    forms:
      ind.perf.akt.1.sg: "{perfekt}ī"
      ind.perf.akt.2.sg: "{perfekt}istī"
      ind.perf.akt.3.sg: "{perfekt}it"
      ind.perf.akt.1.pl: "{perfekt}imus"
      ind.perf.akt.2.pl: "{perfekt}istis"
      ind.perf.akt.3.pl: ["{perfekt}ērunt", "{perfekt}ēre"]
      ind.plusq.akt.1.sg: "{perfekt}eram"
      ind.plusq.akt.2.sg: "{perfekt}erās"
      ind.plusq.akt.3.sg: "{perfekt}erat"
      ind.plusq.akt.1.pl: "{perfekt}erāmus"
      ind.plusq.akt.2.pl: "{perfekt}erātis"
      ind.plusq.akt.3.pl: "{perfekt}erant"
      ind.fut2.akt.1.sg: "{perfekt}erō"
      ind.fut2.akt.2.sg: "{perfekt}eris"
      ind.fut2.akt.3.sg: "{perfekt}erit"
      ind.fut2.akt.1.pl: "{perfekt}erimus"
      ind.fut2.akt.2.pl: "{perfekt}eritis"
      ind.fut2.akt.3.pl: "{perfekt}erint"
      konj.perf.akt.1.sg: "{perfekt}erim"
      konj.perf.akt.2.sg: "{perfekt}eris"
      konj.perf.akt.3.sg: "{perfekt}erit"
      konj.perf.akt.1.pl: "{perfekt}erimus"
      konj.perf.akt.2.pl: "{perfekt}eritis"
      konj.perf.akt.3.pl: "{perfekt}erint"
      konj.plusq.akt.1.sg: "{perfekt}issem"
      konj.plusq.akt.2.sg: "{perfekt}issēs"
      konj.plusq.akt.3.sg: "{perfekt}isset"
      konj.plusq.akt.1.pl: "{perfekt}issēmus"
      konj.plusq.akt.2.pl: "{perfekt}issētis"
      konj.plusq.akt.3.pl: "{perfekt}issent"
      inf.perf.akt: "{perfekt}isse"

  Verb-Basis:
    abstract: true
    inherits_from: Perfekt-System
    stems:
      ppp: {from: supinum, remove: "um", display: PPP-Stamm}
      pfa: {from: futurpartizip, remove: "us", default: "{ppp}ūr", display: PFA-Stamm}
    delegate:
      - {name: pfa, type: a-o-Endungen, bind: {stamm: pfa}, set: {modus: part, tempus: fut, genus_verbi: akt}}
      - {name: ppa, type: 3-Endungen-Partizip, bind: {stamm: ppa, nom_m: ppa_nom, nom_f: ppa_nom, nom_n: ppa_nom}, set: {modus: part, tempus: praes, genus_verbi: akt}}
      - {name: gerv, type: a-o-Endungen, bind: {stamm: gerv}, set: {modus: gerv}}
    compose:
      - match: {modus: inf, tempus: fut, genus_verbi: akt}
        join: " "
        parts:
          - {self: pfa, set: {kasus: akk, numerus: sg, genus: m}}
          - {lexeme: esse, set: {modus: inf, tempus: praes, genus_verbi: akt}}
    forms:
      sup.akk: "{ppp}um"
      sup.abl: "{ppp}ū"

  Verb-Vollständig:
    abstract: true
    inherits_from: Verb-Basis
    delegate:
      - {name: ppp, type: a-o-Endungen, bind: {stamm: ppp}, set: {modus: part, tempus: perf, genus_verbi: pass}}
    compose:
      - match: {modus: [ind, konj], genus_verbi: pass, tempus: [perf, plusq, fut2]}
        join: " "
        parts:
          - {self: ppp, set: {kasus: nom, genus: m}, pass: [numerus]}
          - {lexeme: esse, pass: [modus, person, numerus], map: {tempus: {perf: praes, plusq: impf, fut2: fut}, genus_verbi: {pass: akt}}}
      - match: {modus: inf, tempus: perf, genus_verbi: pass}
        join: " "
        parts:
          - {self: ppp, set: {kasus: akk, numerus: sg, genus: m}}
          - {lexeme: esse, set: {modus: inf, tempus: praes, genus_verbi: akt}}
    forms:
      inf.fut.pass: "{ppp}um īrī"

  A-Konjugation:
    inherits_from: Verb-Vollständig
    stems:
      wurzel:   {from: infinitiv, remove: ["āre", "ārī"], display: Wurzel}
      praesens: {template: "{wurzel}ā", display: Präsensstamm}
      perfekt:  {from: perfekt_1sg, remove: "ī", default: "{praesens}v", display: Perfektstamm}
      ppp:      {from: supinum, remove: "um", default: "{praesens}t", display: PPP-Stamm}
      ppa:      {template: "{praesens}nt", display: PPA-Stamm}
      ppa_nom:  {template: "{praesens}ns", display: PPA Nominativ}
      gerv:     {template: "{praesens}nd", display: Gerundivstamm}
    sandhi: [a_ausfall, kurz_nt, kurz_t]
    forms:
      ind.praes.akt.1.sg: "{praesens}ō"
