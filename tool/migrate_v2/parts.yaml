# Principal parts and form overrides the old data cannot supply.
#
# The old files carry macrons on the lemma only, no supine and no perfect stem,
# so every item whose perfect or supine differs from its type's default needs an
# entry here. `migrate.dart` checks the other direction too: an item whose old
# perfect disagrees with the generated one and has no entry stops the run.
#
# Keyed by old item id. `parts` is merged into the item's principal parts,
# `forms` into its form overrides, `deponent` is copied as given.
nouns:
  nouns:dies:
    parts: {nom: diēs}
  nouns:bestia:
    parts: {nom: bēstia}
  nouns:regis:
    parts: {nom: rēx, gen: rēgis}
  nouns:uxoris:
    parts: {nom: uxor, gen: uxōris}
  nouns:corporis:
    parts: {nom: corpus, gen: corporis}
  nouns:urbis:
    parts: {nom: urbs, gen: urbis}
  nouns:partis:
    parts: {nom: pars, gen: partis}
  nouns:maris:
    parts: {nom: mare, gen: maris}
  nouns:animalis:
    parts: {nom: animal, gen: animālis}

verbs:
  verbs:capere:
    parts: {praesens_1sg: capiō, perfekt_1sg: cēpī, supinum: captum}
  verbs:venire:
    parts: {perfekt_1sg: vēnī, supinum: ventum}
  verbs:convenire:
    parts: {perfekt_1sg: convēnī, supinum: conventum}
  verbs:dare:
    parts: {perfekt_1sg: dedī, supinum: datum}
  verbs:gaudere:
    parts: {supinum: gāvīsum}
    deponent: [perf, plusq, fut2]
  verbs:manere:
    parts: {perfekt_1sg: mānsī, supinum: mānsum}
  verbs:respondere:
    parts: {perfekt_1sg: respondī, supinum: respōnsum}
  verbs:ridere:
    parts: {perfekt_1sg: rīsī, supinum: rīsum}
  verbs:sedere:
    parts: {perfekt_1sg: sēdī, supinum: sessum}
  verbs:videre:
    parts: {perfekt_1sg: vīdī, supinum: vīsum}
  verbs:agere:
    parts: {perfekt_1sg: ēgī, supinum: āctum}
  verbs:dicere:
    parts: {perfekt_1sg: dīxī, supinum: dictum}
    forms: {imp.praes.akt.2.sg: dīc}
  verbs:ducere:
    parts: {perfekt_1sg: dūxī, supinum: ductum}
    forms: {imp.praes.akt.2.sg: dūc}
  verbs:scribere:
    parts: {perfekt_1sg: scrīpsī, supinum: scrīptum}
  verbs:legere:
    parts: {perfekt_1sg: lēgī, supinum: lēctum}
  verbs:mittere:
    parts: {perfekt_1sg: mīsī, supinum: missum}
  verbs:vincere:
    parts: {perfekt_1sg: vīcī, supinum: victum}
  verbs:ponere:
    parts: {perfekt_1sg: posuī, supinum: positum}
