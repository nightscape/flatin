# German verb forms that translate a Latin verb form, in the course
# convention: a finite form carries its subject pronoun, the indicative stands
# in main-clause order, the subjunctive in the verb-final order of an indirect
# question ("ob ..."). Keys without genus_verbi are raw forms, the building
# blocks of the compose rules; keys with genus_verbi are the German forms.
data_file_id: german_verbs

axes:
  modus:
    name: {de: Modus, en: Mood}
    values:
      ind: {de: Indikativ, en: Indicative}
      konj: {de: Konjunktiv, en: Subjunctive}
      inf: {de: Infinitiv, en: Infinitive}
      part: {de: Partizip, en: Participle}
    hidden_in_label: [ind]
  tempus:
    name: {de: Tempus, en: Tense}
    values:
      praes: {de: Präsens, en: Present}
      impf: {de: Imperfekt, en: Imperfect}
      fut: {de: Futur I, en: Future}
      perf: {de: Perfekt, en: Perfect}
      plusq: {de: Plusquamperfekt, en: Pluperfect}
      fut2: {de: Futur II, en: Future perfect}
  genus_verbi:
    name: {de: Genus verbi, en: Voice}
    values:
      akt: {de: Aktiv, en: Active}
      pass: {de: Passiv, en: Passive}
    hidden_in_label: [akt]
  person:
    name: {de: Person, en: Person}
    values:
      "1": {de: "1. Person", en: "1st person"}
      "2": {de: "2. Person", en: "2nd person"}
      "3": {de: "3. Person", en: "3rd person"}
  numerus:
    name: {de: Numerus, en: Number}
    values:
      sg: {de: Singular, en: Singular}
      pl: {de: Plural, en: Plural}

label:
  head: [modus, tempus, genus_verbi]
  tail: [person, numerus]
  merge_axis: person

parts:
  infinitiv:    {label: {de: Infinitiv, en: Infinitive}}
  grundverb:    {label: {de: Grundverb, en: Base verb}}
  partikel:     {label: {de: Verbzusatz, en: Verb particle}}
  wortgruppe:   {label: {de: Verbzusatz aus mehreren Wörtern, en: Multi-word verb particle}}
  praesens_1sg: {label: {de: "1. Person Singular Präsens", en: "1st person singular present"}}
  praesens_2sg: {label: {de: "2. Person Singular Präsens", en: "2nd person singular present"}}
  praesens_3sg: {label: {de: "3. Person Singular Präsens", en: "3rd person singular present"}}
  praesens_1pl: {label: {de: "1. Person Plural Präsens", en: "1st person plural present"}}
  praesens_2pl: {label: {de: "2. Person Plural Präsens", en: "2nd person plural present"}}
  praeteritum:  {label: {de: Präteritum, en: Preterite}}
  konjunktiv2:  {label: {de: Konjunktiv II, en: Subjunctive II}}
  partizip2:    {label: {de: Partizip II, en: Past participle}}

defaults:
  given_part: infinitiv
  lemma_part: infinitiv

sandhi:
  dental_t: {end: t, before: [t, st], replace: te, explain: {de: nach t wird ein e eingeschoben, en: an e is inserted after t}}
  dental_d: {end: d, before: [t, st], replace: de, explain: {de: nach d wird ein e eingeschoben, en: an e is inserted after d}}
  e_en:     {end: e, before: [en], replace: "", explain: {de: e fällt vor -en aus, en: e drops before -en}}

classes: [konjugation, pronomen]

shared:
  # A verb without a personal passive: the course asks no German passive.
  ohne_passiv: &ohne_passiv [{genus_verbi: pass}]

types:
  Verbformen:
    abstract: true
    forms:
      ind.praes.1.sg: "{p1sg}"
      ind.praes.2.sg: "{p2sg}"
      ind.praes.3.sg: "{p3sg}"
      ind.praes.1.pl: "{p1pl}"
      ind.praes.2.pl: "{p2pl}"
      ind.praes.3.pl: "{p1pl}"
      ind.impf.1.sg: "{praet}"
      ind.impf.2.sg: "{praet}st"
      ind.impf.3.sg: "{praet}"
      ind.impf.1.pl: "{praet}en"
      ind.impf.2.pl: "{praet}t"
      ind.impf.3.pl: "{praet}en"
      konj.impf.1.sg: "{k2}"
      konj.impf.2.sg: "{k2}st"
      konj.impf.3.sg: "{k2}"
      konj.impf.1.pl: "{k2}en"
      konj.impf.2.pl: "{k2}t"
      konj.impf.3.pl: "{k2}en"
      inf: "{inf}"
      part.praes: "{inf}d"
      part.perf: "{p2}"

  Verbstamm:
    abstract: true
    required_stems: [praes, praet, inf, p2]
    stems:
      wurzel: {from: infinitiv, remove: [en, n]}
      praes: {from: grundverb, remove: [en, n], default: "{wurzel}", display: {de: Präsensstamm, en: Present stem}}
      # Only the vowel change ends in -t; "weiß" and "wird" keep their spelling.
      p23:   {from: praesens_3sg, remove: [t, ""], default: "{praes}", display: {de: Präsensstamm 2./3. Sg., en: Present stem 2nd/3rd sg}}
      p1sg:  {from: praesens_1sg, default: "{praes}e", display: {de: 1. Sg. Präsens, en: 1st sg present}}
      p2sg:  {from: praesens_2sg, default: "{p23}st", display: {de: 2. Sg. Präsens, en: 2nd sg present}}
      p3sg:  {from: praesens_3sg, default: "{p23}t", display: {de: 3. Sg. Präsens, en: 3rd sg present}}
      p1pl:  {from: praesens_1pl, default: "{praes}en", display: {de: 1. Pl. Präsens, en: 1st pl present}}
      p2pl:  {from: praesens_2pl, default: "{praes}t", display: {de: 2. Pl. Präsens, en: 2nd pl present}}
      praet: {from: praeteritum, display: {de: Präteritalstamm, en: Preterite stem}}
      k2:    {from: konjunktiv2, display: {de: Konjunktiv-II-Stamm, en: Subjunctive II stem}}
      inf:   {from: infinitiv, display: {de: Infinitiv, en: Infinitive}}
      p2:    {from: partizip2, display: {de: Partizip II, en: Past participle}}
      partikel:   {from: partikel, display: {de: Verbzusatz, en: Verb particle}}
      wortgruppe: {from: wortgruppe, display: {de: Verbzusatz, en: Verb particle}}
    delegate:
      - name: roh
        type: Verbformen
        bind: {p1sg: p1sg, p2sg: p2sg, p3sg: p3sg, p1pl: p1pl, p2pl: p2pl, praet: praet, k2: k2, inf: inf, p2: p2}
        set: {}
        emit: false
    sandhi: [dental_t, dental_d, e_en]

  Hilfsverb:
    class: konjugation
    display: {de: Hilfsverb, en: Auxiliary verb}
    inherits_from: Verbstamm

  # The indicative stands in main-clause order: the reflexive pronoun follows
  # the finite verb, a particle goes to the end. The subjunctive stands in
  # verb-final order, where a one-word particle joins the finite verb.
  Verb:
    abstract: true
    inherits_from: Verbstamm
    slots: {hilfsverb: hv_haben}
    compose:
      - match: {modus: ind, tempus: [praes, impf], genus_verbi: akt}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {self: roh, pass: [modus, tempus, person, numerus]}
          - {slot: reflexiv, pass: [person, numerus], optional: true}
          - {stem: wortgruppe, optional: true}
          - {stem: partikel, optional: true}
      - match: {modus: ind, tempus: fut, genus_verbi: akt}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {lexeme: hv_werden, set: {modus: ind, tempus: praes}, pass: [person, numerus]}
          - {slot: reflexiv, pass: [person, numerus], optional: true}
          - {self: roh, set: {modus: inf}}
      - match: {modus: ind, tempus: perf, genus_verbi: akt}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {slot: hilfsverb, set: {modus: ind, tempus: praes}, pass: [person, numerus]}
          - {slot: reflexiv, pass: [person, numerus], optional: true}
          - {self: roh, set: {modus: part, tempus: perf}}
      # The simple past is also accepted for the perfect.
      - match: {modus: ind, tempus: perf, genus_verbi: akt}
        variant: true
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {self: roh, set: {modus: ind, tempus: impf}, pass: [person, numerus]}
          - {slot: reflexiv, pass: [person, numerus], optional: true}
          - {stem: wortgruppe, optional: true}
          - {stem: partikel, optional: true}
      - match: {modus: ind, tempus: plusq, genus_verbi: akt}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {slot: hilfsverb, set: {modus: ind, tempus: impf}, pass: [person, numerus]}
          - {slot: reflexiv, pass: [person, numerus], optional: true}
          - {self: roh, set: {modus: part, tempus: perf}}
      - match: {modus: ind, tempus: fut2, genus_verbi: akt}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {lexeme: hv_werden, set: {modus: ind, tempus: praes}, pass: [person, numerus]}
          - {slot: reflexiv, pass: [person, numerus], optional: true}
          - {self: roh, set: {modus: part, tempus: perf}}
          - {slot: hilfsverb, set: {modus: inf}}
      - match: {modus: konj, tempus: praes, genus_verbi: akt}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {slot: reflexiv, pass: [person, numerus], optional: true}
          - {stem: wortgruppe, optional: true}
          - {stem: partikel, optional: true, join: "", sandhi: false}
          - {self: roh, set: {modus: ind}, pass: [tempus, person, numerus]}
      # A synthetic subjunctive II is also accepted.
      - match: {modus: konj, tempus: impf, genus_verbi: akt}
        variant: true
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {slot: reflexiv, pass: [person, numerus], optional: true}
          - {stem: wortgruppe, optional: true}
          - {stem: partikel, optional: true, join: "", sandhi: false}
          - {self: roh, pass: [modus, tempus, person, numerus]}
      - match: {modus: konj, tempus: perf, genus_verbi: akt}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {slot: reflexiv, pass: [person, numerus], optional: true}
          - {self: roh, set: {modus: part, tempus: perf}}
          - {slot: hilfsverb, set: {modus: ind, tempus: praes}, pass: [person, numerus]}
      - match: {modus: konj, tempus: plusq, genus_verbi: akt}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {slot: reflexiv, pass: [person, numerus], optional: true}
          - {self: roh, set: {modus: part, tempus: perf}}
          - {slot: hilfsverb, set: {modus: konj, tempus: impf}, pass: [person, numerus]}
      - match: {modus: inf, tempus: praes, genus_verbi: akt}
        join: " "
        parts:
          - {slot: reflexiv, set: {person: "3", numerus: sg}, optional: true}
          - {self: roh, set: {modus: inf}}
      - match: {modus: inf, tempus: perf, genus_verbi: akt}
        join: " "
        parts:
          - {slot: reflexiv, set: {person: "3", numerus: sg}, optional: true}
          - {self: roh, set: {modus: part, tempus: perf}}
          - {slot: hilfsverb, set: {modus: inf}}
      - match: {modus: part, tempus: praes, genus_verbi: akt}
        join: " "
        parts:
          - {slot: reflexiv, set: {person: "3", numerus: sg}, optional: true}
          - {self: roh, set: {modus: part, tempus: praes}}
      - match: {modus: part, tempus: perf, genus_verbi: akt}
        join: " "
        parts:
          - {slot: reflexiv, set: {person: "3", numerus: sg}, optional: true}
          - {self: roh, set: {modus: part, tempus: perf}}
      - match: {modus: ind, tempus: [praes, impf], genus_verbi: pass}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {lexeme: hv_werden, set: {modus: ind}, pass: [tempus, person, numerus]}
          - {self: roh, set: {modus: part, tempus: perf}}
      - match: {modus: ind, tempus: fut, genus_verbi: pass}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {lexeme: hv_werden, set: {modus: ind, tempus: praes}, pass: [person, numerus]}
          - {self: roh, set: {modus: part, tempus: perf}}
          - {lexeme: hv_werden, set: {modus: inf}}
      - match: {modus: ind, tempus: [perf, plusq], genus_verbi: pass}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {lexeme: hv_sein, set: {modus: ind}, map: {tempus: {perf: praes, plusq: impf}}, pass: [person, numerus]}
          - {self: roh, set: {modus: part, tempus: perf}}
          - {lexeme: hv_werden, set: {modus: part, tempus: perf}}
      - match: {modus: ind, tempus: fut2, genus_verbi: pass}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {lexeme: hv_werden, set: {modus: ind, tempus: praes}, pass: [person, numerus]}
          - {self: roh, set: {modus: part, tempus: perf}}
          - {lexeme: hv_werden, set: {modus: part, tempus: perf}}
          - {lexeme: hv_sein, set: {modus: inf}}
      - match: {modus: konj, tempus: praes, genus_verbi: pass}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {self: roh, set: {modus: part, tempus: perf}}
          - {lexeme: hv_werden, set: {modus: ind, tempus: praes}, pass: [person, numerus]}
      - match: {modus: konj, tempus: impf, genus_verbi: pass}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {self: roh, set: {modus: part, tempus: perf}}
          - {lexeme: hv_werden, set: {modus: konj, tempus: impf}, pass: [person, numerus]}
      - match: {modus: konj, tempus: perf, genus_verbi: pass}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {self: roh, set: {modus: part, tempus: perf}}
          - {lexeme: hv_werden, set: {modus: part, tempus: perf}}
          - {lexeme: hv_sein, set: {modus: ind, tempus: praes}, pass: [person, numerus]}
      - match: {modus: konj, tempus: plusq, genus_verbi: pass}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {self: roh, set: {modus: part, tempus: perf}}
          - {lexeme: hv_werden, set: {modus: part, tempus: perf}}
          - {lexeme: hv_sein, set: {modus: konj, tempus: impf}, pass: [person, numerus]}
      - match: {modus: inf, tempus: praes, genus_verbi: pass}
        join: " "
        parts:
          - {self: roh, set: {modus: part, tempus: perf}}
          - {lexeme: hv_werden, set: {modus: inf}}
      - match: {modus: inf, tempus: perf, genus_verbi: pass}
        join: " "
        parts:
          - {self: roh, set: {modus: part, tempus: perf}}
          - {lexeme: hv_werden, set: {modus: part, tempus: perf}}
          - {lexeme: hv_sein, set: {modus: inf}}
      - match: {modus: part, tempus: perf, genus_verbi: pass}
        parts:
          - {self: roh, set: {modus: part, tempus: perf}}

  # The subjunctive II is "würde" with the infinitive.
  Verb-würde:
    abstract: true
    inherits_from: Verb
    compose:
      - match: {modus: konj, tempus: impf, genus_verbi: akt}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {slot: reflexiv, pass: [person, numerus], optional: true}
          - {self: roh, set: {modus: inf}}
          - {lexeme: hv_werden, pass: [modus, tempus, person, numerus]}

  schwach:
    class: konjugation
    display: {de: schwach, en: weak}
    inherits_from: Verb-würde
    stems:
      praet: {from: praeteritum, default: "{praes}te", display: {de: Präteritalstamm, en: Preterite stem}}

  stark:
    class: konjugation
    display: {de: stark, en: strong}
    inherits_from: Verb-würde

  gemischt:
    class: konjugation
    display: {de: gemischt, en: mixed}
    inherits_from: Verb-würde

  # sein, haben and werden keep their own subjunctive II.
  unregelmäßig:
    class: konjugation
    display: {de: unregelmäßig, en: irregular}
    inherits_from: Verb
    required_stems: [praes, praet, inf, p2, k2]
    compose:
      - match: {modus: konj, tempus: impf, genus_verbi: akt}
        join: " "
        parts:
          - {lexeme: pron, pass: [person, numerus]}
          - {self: roh, pass: [modus, tempus, person, numerus]}

  Personalpronomen:
    class: pronomen
    display: {de: Personalpronomen, en: Personal pronoun}
    forms:
      1.sg: ich
      2.sg: du
      3.sg: er/sie/es
      1.pl: wir
      2.pl: ihr
      3.pl: sie (Pl.)

  Reflexivpronomen:
    class: pronomen
    display: {de: Reflexivpronomen, en: Reflexive pronoun}
    forms:
      1.sg: mich
      2.sg: dich
      3.sg: sich
      1.pl: uns
      2.pl: euch
      3.pl: sich

  ReflexivpronomenDativ:
    class: pronomen
    display: {de: Reflexivpronomen im Dativ, en: Dative reflexive pronoun}
    forms:
      1.sg: mir
      2.sg: dir
      3.sg: sich
      1.pl: uns
      2.pl: euch
      3.pl: sich

items:
  - id: pron
    type: Personalpronomen
    translation: {de: Personalpronomen, en: personal pronoun}
    parts: {infinitiv: ich}
  - id: refl
    type: Reflexivpronomen
    translation: {de: Reflexivpronomen, en: reflexive pronoun}
    parts: {infinitiv: sich}
  - id: refl_dat
    type: ReflexivpronomenDativ
    translation: {de: Reflexivpronomen im Dativ, en: dative reflexive pronoun}
    parts: {infinitiv: sich}

  - id: hv_haben
    type: Hilfsverb
    translation: {de: haben, en: have}
    parts: {infinitiv: haben, praesens_2sg: hast, praesens_3sg: hat, praeteritum: hatte, konjunktiv2: hätte, partizip2: gehabt}
  - id: hv_sein
    type: Hilfsverb
    translation: {de: sein, en: be}
    parts: {infinitiv: sein, praesens_1sg: bin, praesens_2sg: bist, praesens_3sg: ist, praesens_1pl: sind, praesens_2pl: seid, praeteritum: war, konjunktiv2: wäre, partizip2: gewesen}
  - id: hv_werden
    type: Hilfsverb
    translation: {de: werden, en: become}
    parts: {infinitiv: werden, praesens_2sg: wirst, praesens_3sg: wird, praeteritum: wurde, konjunktiv2: würde, partizip2: worden}

  - type: schwach
    translation: {de: lieben, en: love}
    parts: {infinitiv: lieben, partizip2: geliebt}
  - type: schwach
    translation: {de: arbeiten, en: work}
    parts: {infinitiv: arbeiten, partizip2: gearbeitet}
    absent: *ohne_passiv
  - type: stark
    translation: {de: rufen, en: call}
    parts: {infinitiv: rufen, praeteritum: rief, partizip2: gerufen}
  - type: stark
    translation: {de: tragen, en: carry}
    parts: {infinitiv: tragen, praesens_3sg: trägt, praeteritum: trug, partizip2: getragen}
  - type: gemischt
    translation: {de: wissen, en: know}
    parts: {infinitiv: wissen, praesens_1sg: weiß, praesens_2sg: weißt, praesens_3sg: weiß, praeteritum: wusste, konjunktiv2: wüsste, partizip2: gewusst}
    absent: *ohne_passiv
  - type: stark
    translation: {de: kommen, en: come}
    parts: {infinitiv: kommen, praeteritum: kam, partizip2: gekommen}
    slots: {hilfsverb: hv_sein}
    absent: *ohne_passiv
  - type: unregelmäßig
    translation: {de: sein, en: be}
    parts: {infinitiv: sein, praesens_1sg: bin, praesens_2sg: bist, praesens_3sg: ist, praesens_1pl: sind, praesens_2pl: seid, praeteritum: war, konjunktiv2: wäre, partizip2: gewesen}
    slots: {hilfsverb: hv_sein}
    forms: {part.praes.akt: seiend}
    absent: *ohne_passiv
  - type: stark
    translation: {de: zusammenrufen, en: call together}
    parts: {infinitiv: zusammenrufen, grundverb: rufen, partikel: zusammen, praeteritum: rief, partizip2: zusammengerufen}
  - id: sich freuen
    type: schwach
    translation: {de: sich freuen, en: rejoice}
    parts: {infinitiv: freuen, partizip2: gefreut}
    slots: {reflexiv: refl}
    absent: *ohne_passiv
  - id: sich in acht nehmen
    type: stark
    translation: {de: sich in Acht nehmen, en: beware}
    parts: {infinitiv: in Acht nehmen, grundverb: nehmen, wortgruppe: in Acht, praesens_3sg: nimmt, praeteritum: nahm, partizip2: in Acht genommen}
    slots: {reflexiv: refl}
    absent: *ohne_passiv

  # package 1
  - type: schwach
    translation: {de: hören, en: hear}
    parts: {infinitiv: hören, partizip2: gehört}
  - type: stark
    translation: {de: nehmen, en: take}
    parts: {infinitiv: nehmen, praesens_3sg: nimmt, praeteritum: nahm, partizip2: genommen}
  - type: stark
    translation: {de: gebären, en: give birth to}
    parts: {infinitiv: gebären, praeteritum: gebar, partizip2: geboren}
  - type: stark
    translation: {de: betreten, en: enter}
    parts: {infinitiv: betreten, praesens_2sg: betrittst, praesens_3sg: betritt, praeteritum: betrat, partizip2: betreten}
  - type: stark
    translation: {de: erscheinen, en: appear}
    parts: {infinitiv: erscheinen, praeteritum: erschien, partizip2: erschienen}
    slots: {hilfsverb: hv_sein}
    absent: *ohne_passiv
  - type: schwach
    translation: {de: bauen, en: build}
    parts: {infinitiv: bauen, partizip2: gebaut}
  - type: stark
    translation: {de: gehen, en: go}
    parts: {infinitiv: gehen, praeteritum: ging, partizip2: gegangen}
