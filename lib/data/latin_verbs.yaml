items:
  - translation: "lieben, gern haben"
    parts: {infinitiv: "amāre", praesens_1sg: "amō"}
  - translation: "haben, halten"
    parts: {infinitiv: "habēre", praesens_1sg: "habeō"}
  - translation: "hören"
    parts: {infinitiv: "audīre", praesens_1sg: "audiō"}
  - type: Mischkonjugation
    translation: "nehmen"
    parts: {infinitiv: "capere", praesens_1sg: "capiō", perfekt_1sg: "cēpī", supinum: "captum"}
  - id: parere2
    type: Mischkonjugation
    translation: "gebären; hervorbringen"
    parts: {infinitiv: "parere", praesens_1sg: "pariō", perfekt_1sg: "peperī", supinum: "partum"}
  - translation: "kommen"
    parts: {infinitiv: "venīre", praesens_1sg: "veniō", perfekt_1sg: "vēnī", supinum: "ventum"}
  - translation: "eintreten, betreten"
    parts: {infinitiv: "intrāre", praesens_1sg: "intrō"}
  - translation: "erscheinen, auftauchen, sich zeigen"
    parts: {infinitiv: "appārēre", praesens_1sg: "appāreō"}
  - translation: "bauen, erbauen"
    parts: {infinitiv: "aedificāre", praesens_1sg: "aedificō"}
  - translation: "gehen, spazieren gehen"
    parts: {infinitiv: "ambulāre", praesens_1sg: "ambulō"}
  - translation: "herbeibringen, hintragen"
    parts: {infinitiv: "apportāre", praesens_1sg: "apportō"}
  - translation: "sich nähern, herankommen"
    parts: {infinitiv: "appropinquāre", praesens_1sg: "appropinquō"}
  - translation: "zögern, sich nicht beeilen"
    parts: {infinitiv: "cessāre", praesens_1sg: "cessō"}
  - translation: "rufen, schreien"
    parts: {infinitiv: "clāmāre", praesens_1sg: "clāmō"}
  - translation: "zusammenkommen, sich versammeln"
    parts: {infinitiv: "convenīre", praesens_1sg: "conveniō", perfekt_1sg: "convēnī", supinum: "conventum"}
  - translation: "speisen, essen"
    parts: {infinitiv: "cēnāre", praesens_1sg: "cēnō"}
  - translation: "sorgen (für), sich kümmern (um)"
    parts: {infinitiv: "cūrāre", praesens_1sg: "cūrō"}
  - type: A-Konjugation
    translation: "geben, schenken"
    parts: {infinitiv: "dare", praesens_1sg: "dō", perfekt_1sg: "dedī", supinum: "datum", praesens_stamm: "da"}
  - translation: "schlafen"
    parts: {infinitiv: "dormīre", praesens_1sg: "dormiō"}
  - translation: "(jmd.) erfreuen, unterhalten"
    parts: {infinitiv: "dēlectāre", praesens_1sg: "dēlectō"}
  - translation: "wünschen, verlangen; vermissen"
    parts: {infinitiv: "dēsīderāre", praesens_1sg: "dēsīderō"}
  - translation: "erklären, darlegen"
    parts: {infinitiv: "explicāre", praesens_1sg: "explicō"}
  - translation: "warten, erwarten"
    parts: {infinitiv: "exspectāre", praesens_1sg: "exspectō"}
  - translation: "in die Flucht schlagen, vertreiben"
    parts: {infinitiv: "fugāre", praesens_1sg: "fugō"}
  - translation: "sich freuen"
    parts: {infinitiv: "gaudēre", praesens_1sg: "gaudeō", supinum: "gāvīsum"}
    deponent: ["perf", "plusq", "fut2"]
  - translation: "befehlen, (be)herrschen"
    parts: {infinitiv: "imperāre", praesens_1sg: "imperō"}
  - translation: "arbeiten, sich anstrengen"
    parts: {infinitiv: "labōrāre", praesens_1sg: "labōrō"}
  - translation: "bleiben, warten; erwarten"
    parts: {infinitiv: "manēre", praesens_1sg: "maneō", perfekt_1sg: "mānsī", supinum: "mānsum"}
  - translation: "töten"
    parts: {infinitiv: "necāre", praesens_1sg: "necō"}
  - translation: "bereiten, vorbereiten, zubereiten"
    parts: {infinitiv: "parāre", praesens_1sg: "parō"}
  - translation: "gefallen"
    parts: {infinitiv: "placēre", praesens_1sg: "placeō"}
  - translation: "tragen, bringen"
    parts: {infinitiv: "portāre", praesens_1sg: "portō"}
  - translation: "(etwas) für gut befinden; prüfen, beweisen"
    parts: {infinitiv: "probāre", praesens_1sg: "probō"}
  - translation: "verhindern, hindern; abhalten"
    parts: {infinitiv: "prohibēre", praesens_1sg: "prohibeō"}
  - translation: "eilen, sich beeilen"
    parts: {infinitiv: "properāre", praesens_1sg: "properō"}
  - translation: "gehorchen"
    parts: {infinitiv: "pārēre", praesens_1sg: "pāreō"}
  - translation: "kämpfen, streiten"
    parts: {infinitiv: "pūgnāre", praesens_1sg: "pūgnō"}
  - translation: "antworten, erwidern"
    parts: {infinitiv: "respondēre", praesens_1sg: "respondeō", perfekt_1sg: "respondī", supinum: "respōnsum"}
  - translation: "fragen; bitten"
    parts: {infinitiv: "rogāre", praesens_1sg: "rogō"}
  - translation: "König sein, herrschen"
    parts: {infinitiv: "rēgnāre", praesens_1sg: "rēgnō"}
  - translation: "lachen; über etw. lachen"
    parts: {infinitiv: "rīdēre", praesens_1sg: "rīdeō", perfekt_1sg: "rīsī", supinum: "rīsum"}
  - translation: "opfern"
