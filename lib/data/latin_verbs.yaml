      ind.fut.pass.2.pl: "{praesens}biminī"
      ind.fut.pass.3.pl: "{praesens}buntur"
      konj.praes.pass.1.sg: "{praesens}er"
      konj.praes.pass.2.sg: "{praesens}ēris"
      konj.praes.pass.3.sg: "{praesens}ētur"
