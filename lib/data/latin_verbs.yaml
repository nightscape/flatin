data_file_id: verbs

axes:
  modus:
    name: {de: Modus, en: Mood}
    values:
      ind: {de: Indikativ, en: Indicative}
      konj: {de: Konjunktiv, en: Subjunctive}
      imp: {de: Imperativ, en: Imperative}
      inf: {de: Infinitiv, en: Infinitive}
      part: {de: Partizip, en: Participle}
      ger: {de: Gerundium, en: Gerund}
      gerv: {de: Gerundivum, en: Gerundive}
      sup: {de: Supinum, en: Supine}
    hidden_in_label: [ind]
  tempus:
    name: {de: Tempus, en: Tense}
    values:
      praes: {de: Präsens, en: Present}
      impf: {de: Imperfekt, en: Imperfect}
      fut: {de: Futur I, en: Future}
      perf: {de: Perfekt, en: Perfect}
      plusq: {de: Plusquamperfekt, en: Pluperfect}
      fut2: {de: Futur II, en: Future perfect}
  genus_verbi:
    name: {de: Genus verbi, en: Voice}
    values:
      akt: {de: Aktiv, en: Active}
      pass: {de: Passiv, en: Passive}
    hidden_in_label: [akt]
  person:
    name: {de: Person, en: Person}
    values:
      "1": {de: "1. Person", en: "1st person"}
      "2": {de: "2. Person", en: "2nd person"}
      "3": {de: "3. Person", en: "3rd person"}
  numerus:
    name: {de: Numerus, en: Number}
    values:
      sg: {de: Singular, en: Singular}
      pl: {de: Plural, en: Plural}
  kasus:
    name: {de: Kasus, en: Case}
    values:
      nom: {de: Nominativ, en: Nominative}
      gen: {de: Genitiv, en: Genitive}
      dat: {de: Dativ, en: Dative}
      akk: {de: Akkusativ, en: Accusative}
      abl: {de: Ablativ, en: Ablative}
      vok: {de: Vokativ, en: Vocative}
  genus:
    name: {de: Genus, en: Gender}
    values:
      m: {de: maskulin, en: masculine}
      f: {de: feminin, en: feminine}
      n: {de: neutrum, en: neuter}

label:
  head: [modus, tempus, genus_verbi]
  tail: [person, numerus, kasus, genus]
  merge_axis: person

parts:
  praesens_1sg:   {label: {de: "1. Person Singular", en: "1st person singular"}}
  infinitiv:      {label: {de: Infinitiv, en: Infinitive}}
  perfekt_1sg:    {label: {de: Perfekt, en: Perfect}}
  supinum:        {label: {de: Supinum, en: Supine}}
  praefix:        {label: {de: Präfix, en: Prefix}, display: false}
  praesens_stamm: {label: {de: Präsensstamm, en: Present stem}, display: false}
  futurpartizip:  {label: {de: Partizip Futur, en: Future participle}}
  ppa_nom:        {label: {de: Partizip Präsens, en: Present participle}}
  ppa_gen:        {label: {de: Partizip Präsens Genitiv, en: Present participle genitive}}
  gerundiv:       {label: {de: Gerundivum, en: Gerundive}}

defaults:
  given_part: praesens_1sg
  lemma_part: infinitiv

type_inference:
  infinitiv:
    - {suffix: "ārī", types: [A-Konjugation]}
    - {suffix: "āre", types: [A-Konjugation]}
    - {suffix: "ērī", types: [E-Konjugation]}
    - {suffix: "ēre", types: [E-Konjugation]}
    - {suffix: "īrī", types: [I-Konjugation]}
    - {suffix: "īre", types: [I-Konjugation]}
    - {suffix: "are", min_length: 5, types: [A-Konjugation]}
    - {suffix: "ere", min_length: 5, types: [Konsonantische, Mischkonjugation, E-Konjugation]}

sandhi:
  t_s:         {end: t, before: [s], replace: s, explain: {de: t wird vor s zu s, en: t becomes s before s}}
  d_ausfall:   {end: d, before: consonant, replace: "", explain: {de: d fällt vor Konsonant aus, en: d drops before a consonant}}
  d_angleich:  {end: d, before: [f, l, t], replace: double_next, explain: {de: d gleicht sich dem folgenden Laut an, en: d assimilates to the following sound}}
  a_ausfall:   {end: a, before: vowel, replace: "", explain: {de: ā fällt vor Vokal aus, en: ā drops before a vowel}}
  vokal_kurz:  {end: vowel, before: vowel, replace: short, explain: {de: Vokal vor Vokal wird kurz, en: a vowel before a vowel is short}}
  kurz_nt:     {end: vowel, before: [nt, nd], replace: short, explain: {de: Vokal vor nt/nd wird kurz, en: a vowel before nt/nd is short}}
  kurz_t:      {end: vowel, before: ["t$"], replace: short, explain: {de: Vokal vor -t am Wortende wird kurz, en: a vowel before word-final -t is short}}
  i_ausfall:   {end: i, before: [i], replace: "", explain: {de: i fällt vor langem ī aus, en: i drops before long ī}}
  i_e_r:       {end: i, before: [r], replace: e, explain: {de: i wird vor r zu e, en: i becomes e before r}}
  i_e_auslaut: {end: i, before: ["$"], replace: e, explain: {de: i wird am Wortende zu e, en: i becomes e at the end of a word}}

classes: [konjugation]

types:
  Perfekt-System:
    abstract: true
    stems:
      perfekt: {from: perfekt_1sg, remove: "ī", display: {de: Perfektstamm, en: Perfect stem}}
    forms:
      ind.perf.akt.1.sg: "{perfekt}ī"
      ind.perf.akt.2.sg: "{perfekt}istī"
      ind.perf.akt.3.sg: "{perfekt}it"
      ind.perf.akt.1.pl: "{perfekt}imus"
      ind.perf.akt.2.pl: "{perfekt}istis"
      ind.perf.akt.3.pl: ["{perfekt}ērunt", "{perfekt}ēre"]
      ind.plusq.akt.1.sg: "{perfekt}eram"
      ind.plusq.akt.2.sg: "{perfekt}erās"
      ind.plusq.akt.3.sg: "{perfekt}erat"
      ind.plusq.akt.1.pl: "{perfekt}erāmus"
      ind.plusq.akt.2.pl: "{perfekt}erātis"
      ind.plusq.akt.3.pl: "{perfekt}erant"
      ind.fut2.akt.1.sg: "{perfekt}erō"
      ind.fut2.akt.2.sg: "{perfekt}eris"
      ind.fut2.akt.3.sg: "{perfekt}erit"
      ind.fut2.akt.1.pl: "{perfekt}erimus"
      ind.fut2.akt.2.pl: "{perfekt}eritis"
      ind.fut2.akt.3.pl: "{perfekt}erint"
      konj.perf.akt.1.sg: "{perfekt}erim"
      konj.perf.akt.2.sg: "{perfekt}eris"
      konj.perf.akt.3.sg: "{perfekt}erit"
      konj.perf.akt.1.pl: "{perfekt}erimus"
      konj.perf.akt.2.pl: "{perfekt}eritis"
      konj.perf.akt.3.pl: "{perfekt}erint"
      konj.plusq.akt.1.sg: "{perfekt}issem"
      konj.plusq.akt.2.sg: "{perfekt}issēs"
      konj.plusq.akt.3.sg: "{perfekt}isset"
      konj.plusq.akt.1.pl: "{perfekt}issēmus"
      konj.plusq.akt.2.pl: "{perfekt}issētis"
      konj.plusq.akt.3.pl: "{perfekt}issent"
      inf.perf.akt: "{perfekt}isse"

  Verb-Basis:
    abstract: true
    inherits_from: Perfekt-System
    stems:
      ppp: {from: supinum, remove: "um", display: {de: PPP-Stamm, en: PPP stem}}
      pfa: {from: futurpartizip, remove: "us", default: "{ppp}ūr", display: {de: PFA-Stamm, en: Future participle stem}}
    delegate:
      - {name: pfa, type: a-o-Endungen, bind: {stamm: pfa}, set: {modus: part, tempus: fut, genus_verbi: akt}}
      - {name: ppa, type: 3-Endungen-Partizip, bind: {stamm: ppa, nom_m: ppa_nom, nom_f: ppa_nom, nom_n: ppa_nom}, set: {modus: part, tempus: praes, genus_verbi: akt}}
      - {name: gerv, type: a-o-Endungen, bind: {stamm: gerv}, set: {modus: gerv}}
    compose:
      - match: {modus: inf, tempus: fut, genus_verbi: akt}
        join: " "
        parts:
          - {self: pfa, set: {kasus: akk, numerus: sg, genus: m}}
          - {lexeme: esse, set: {modus: inf, tempus: praes, genus_verbi: akt}}
    forms:
      sup.akk: "{ppp}um"
      sup.abl: "{ppp}ū"

  Verb-Vollständig:
    abstract: true
    inherits_from: Verb-Basis
    delegate:
      - {name: ppp, type: a-o-Endungen, bind: {stamm: ppp}, set: {modus: part, tempus: perf, genus_verbi: pass}}
    compose:
      - match: {modus: [ind, konj], genus_verbi: pass, tempus: [perf, plusq, fut2]}
        join: " "
        parts:
          - {self: ppp, set: {kasus: nom, genus: m}, pass: [numerus]}
          - {lexeme: esse, pass: [modus, person, numerus], map: {tempus: {perf: praes, plusq: impf, fut2: fut}, genus_verbi: {pass: akt}}}
      - match: {modus: inf, tempus: perf, genus_verbi: pass}
        join: " "
        parts:
          - {self: ppp, set: {kasus: akk, numerus: sg, genus: m}}
          - {lexeme: esse, set: {modus: inf, tempus: praes, genus_verbi: akt}}
    forms:
      inf.fut.pass: "{ppp}um īrī"

  A-Konjugation:
    class: konjugation
    display: {de: A-Konjugation, en: "1st conjugation"}
    inherits_from: Verb-Vollständig
    stems:
      wurzel:   {from: infinitiv, remove: ["āre", "ārī"], display: {de: Wurzel, en: Root}}
      praesens: {from: praesens_stamm, default: "{wurzel}ā", display: {de: Präsensstamm, en: Present stem}}
      perfekt:  {from: perfekt_1sg, remove: "ī", default: "{praesens}v", display: {de: Perfektstamm, en: Perfect stem}}
      ppp:      {from: supinum, remove: "um", default: "{praesens}t", display: {de: PPP-Stamm, en: PPP stem}}
      ppa:      {template: "{praesens}nt", display: {de: PPA-Stamm, en: Present participle stem}}
      ppa_nom:  {template: "{praesens}ns", display: {de: PPA Nominativ, en: Present participle nominative}}
      gerv:     {template: "{praesens}nd", display: {de: Gerundivstamm, en: Gerundive stem}}
    sandhi: [a_ausfall, kurz_nt, kurz_t]
    forms:
      ind.praes.akt.1.sg: "{praesens}ō"
      ind.praes.akt.2.sg: "{praesens}s"
      ind.praes.akt.3.sg: "{praesens}t"
      ind.praes.akt.1.pl: "{praesens}mus"
      ind.praes.akt.2.pl: "{praesens}tis"
      ind.praes.akt.3.pl: "{praesens}nt"
      ind.impf.akt.1.sg: "{praesens}bam"
      ind.impf.akt.2.sg: "{praesens}bās"
      ind.impf.akt.3.sg: "{praesens}bat"
      ind.impf.akt.1.pl: "{praesens}bāmus"
      ind.impf.akt.2.pl: "{praesens}bātis"
      ind.impf.akt.3.pl: "{praesens}bant"
      ind.fut.akt.1.sg: "{praesens}bō"
      ind.fut.akt.2.sg: "{praesens}bis"
      ind.fut.akt.3.sg: "{praesens}bit"
      ind.fut.akt.1.pl: "{praesens}bimus"
      ind.fut.akt.2.pl: "{praesens}bitis"
      ind.fut.akt.3.pl: "{praesens}bunt"
      konj.praes.akt.1.sg: "{praesens}em"
      konj.praes.akt.2.sg: "{praesens}ēs"
      konj.praes.akt.3.sg: "{praesens}et"
      konj.praes.akt.1.pl: "{praesens}ēmus"
      konj.praes.akt.2.pl: "{praesens}ētis"
      konj.praes.akt.3.pl: "{praesens}ent"
      konj.impf.akt.1.sg: "{praesens}rem"
      konj.impf.akt.2.sg: "{praesens}rēs"
      konj.impf.akt.3.sg: "{praesens}ret"
      konj.impf.akt.1.pl: "{praesens}rēmus"
      konj.impf.akt.2.pl: "{praesens}rētis"
      konj.impf.akt.3.pl: "{praesens}rent"
      imp.praes.akt.2.sg: "{praesens}"
      imp.praes.akt.2.pl: "{praesens}te"
      imp.fut.akt.2.sg: "{praesens}tō"
      imp.fut.akt.3.sg: "{praesens}tō"
      imp.fut.akt.2.pl: "{praesens}tōte"
      imp.fut.akt.3.pl: "{praesens}ntō"
      inf.praes.akt: "{praesens}re"
      ger.gen: "{praesens}ndī"
      ger.dat: "{praesens}ndō"
      ger.akk: "{praesens}ndum"
      ger.abl: "{praesens}ndō"
      ind.praes.pass.1.sg: "{praesens}or"
      ind.praes.pass.2.sg: "{praesens}ris"
      ind.praes.pass.3.sg: "{praesens}tur"
      ind.praes.pass.1.pl: "{praesens}mur"
      ind.praes.pass.2.pl: "{praesens}minī"
      ind.praes.pass.3.pl: "{praesens}ntur"
      ind.impf.pass.1.sg: "{praesens}bar"
      ind.impf.pass.2.sg: "{praesens}bāris"
      ind.impf.pass.3.sg: "{praesens}bātur"
      ind.impf.pass.1.pl: "{praesens}bāmur"
      ind.impf.pass.2.pl: "{praesens}bāminī"
      ind.impf.pass.3.pl: "{praesens}bantur"
      ind.fut.pass.1.sg: "{praesens}bor"
      ind.fut.pass.2.sg: "{praesens}beris"
      ind.fut.pass.3.sg: "{praesens}bitur"
      ind.fut.pass.1.pl: "{praesens}bimur"
      ind.fut.pass.2.pl: "{praesens}biminī"
      ind.fut.pass.3.pl: "{praesens}buntur"
      konj.praes.pass.1.sg: "{praesens}er"
      konj.praes.pass.2.sg: "{praesens}ēris"
      konj.praes.pass.3.sg: "{praesens}ētur"
      konj.praes.pass.1.pl: "{praesens}ēmur"
      konj.praes.pass.2.pl: "{praesens}ēminī"
      konj.praes.pass.3.pl: "{praesens}entur"
      konj.impf.pass.1.sg: "{praesens}rer"
      konj.impf.pass.2.sg: "{praesens}rēris"
      konj.impf.pass.3.sg: "{praesens}rētur"
      konj.impf.pass.1.pl: "{praesens}rēmur"
      konj.impf.pass.2.pl: "{praesens}rēminī"
      konj.impf.pass.3.pl: "{praesens}rentur"
      imp.praes.pass.2.sg: "{praesens}re"
      imp.praes.pass.2.pl: "{praesens}minī"
      inf.praes.pass: "{praesens}rī"
