# Which lesson of volume 1 introduces which form and which type.
#
# A form belongs to the lesson of the most specific selector that matches it;
# `{}` is the base of the earliest lesson. A type belongs to the lesson that
# introduces its paradigm, so a word can be known before it can be inflected.

- lesson: 1
  nouns:
    forms:
      - {}
    types: [A-Deklination, O-Deklination-maskulinum]
  verbs:
    forms:
      - {modus: ind, tempus: praes, genus_verbi: akt, person: "3", numerus: sg}
      - {modus: inf, tempus: praes, genus_verbi: akt}
    types: [A-Konjugation, E-Konjugation, I-Konjugation]

