# How stored settings of the v1 data are read against the v2
# data. `form_keys` and `types` are keyed by data file, and a
# form key may stand for several new keys because the gender
# merge moved the genus into the key. `item_ids` lists only the
# items whose id changes; `item_key_suffix` gives the genus an
# old item's forms take inside its merged item.
#
# `v0_form_universe` is the old form order: the keys the old
# settings screen offered. The oldest stored format lists what
# was switched ON, so its complement may only be taken against
# these keys — a key the screen never showed was never off.

