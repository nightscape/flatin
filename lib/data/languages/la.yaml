# The Latin language: the analysis codes of `.exam` packs
# (lib/data/EXAM_SCHEMA.md), the parameters of the exam rules, and the codes
# of the sentence corpus (lib/data/SCHEMA.md "Sentence corpus").
id: la
name: {de: Latein, en: Latin}

# Letters that spell the same word without their quantity mark; a card id and
# every comparison of two spellings go through this. Both sides are one code
# unit.
fold:
  ā: a
  ē: e
  ī: i
  ō: o
  ū: u
  ȳ: y
  Ā: A
  Ē: E
  Ī: I
  Ō: O
  Ū: U
  Ȳ: Y

# The body of a character class: the letters a stem or an ending is made of.
letters: "a-zāēīōūȳăĕĭŏŭäöüß"

# The keys of a word token's `analyse` and their codes, in display order.
analyse:
  wortart: [subst, adj, verb, pron, adv, praep, konjunktion, subjunktion, partikel]
  kasus: [nom, gen, dat, akk, abl, vok]
  numerus: [sg, pl]
  genus: [m, f, n]
  person: [1, 2, 3]
  tempus: [praes, impf, perf, plusq, fut, fut2]
  modus: [ind, konj, imp, inf, part]
  genus_verbi: [akt, pass]
  pronomen: [personal, relativ, interrogativ_subst, interrogativ_adj, demonstrativ, possessiv, reflexiv]
  funktion: [gen_subj, gen_obj]
# The one key every `analyse` has.
word_class: wortart
# The keys of the `merkmale` of a `bilden` item.
form: [kasus, numerus, genus, person, tempus, modus, genus_verbi]
rolle: [praedikat, subjekt, objekt, adverbiale, attribut, praedikatsnomen, praedikativum, anrede]
clause:
  art: [haupt, temporal, kausal, kondizional, konzessiv, relativ, aci, pc]
  sinnrichtung: [temporal, kausal, konzessiv, kondizional, attributiv]

# A constraint `{key: code}` matches a word token whose `analyse` (or
# `rolle`) has each code.
rules:
  main_clause: haupt
  no_role: [partikel, konjunktion, subjunktion]
  needs_bezug: [{rolle: attribut}, {rolle: praedikativum}, {pronomen: relativ}]
  person: {key: person, needed_by: {pronomen: personal}}
  participle:
    is: {modus: part}
    form: {tempus: perf, genus_verbi: pass}
    agrees: [kasus, numerus, genus]
    clause: pc
    rolle: {by_sinnrichtung: {attributiv: attribut}, otherwise: adverbiale}
  compound:
    verb: {wortart: verb}
    passive: {genus_verbi: pass}
    tense: tempus
    tense_map: {perf: praes, plusq: impf, fut2: fut}
    marks: [kasus, genus]
    aux: {lemma: esse, form: {genus_verbi: akt}}
    rolle: praedikat
    agrees: [person, numerus, modus]
    infinitive: {is: {modus: inf}, aux: {modus: inf, tempus: praes}}

# The constructions of a sentence. `reference`: it has a word that its head
# refers to; `meaning`: it has a list of meanings; `roles`: the pills of its
# head and reference word, exactly when it has a reference.
constructions:
  frageNe: {reference: false, meaning: false}
  frageNonne: {reference: false, meaning: false}
  frageNum: {reference: false, meaning: false}
  aciPassiv: {reference: true, meaning: false, roles: {head: participle, reference: subject}}
  pcPpa: {reference: true, meaning: true, roles: {head: participle, reference: reference}}
  pcPpp: {reference: true, meaning: true, roles: {head: participle, reference: reference}}
  doppelterAkkusativ: {reference: true, meaning: false, roles: {head: predicative, reference: object}}

# The meanings of a participium coniunctum (Sinnrichtung).
meanings: [temporal, kausal, konzessiv, modal]

# The typical mistakes of a wrong rendering.
mistakes: [tempus, genusVerbi, bezugswort, sinnrichtung, frageart, aussage, rollen, praedikativum]
