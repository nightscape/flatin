# Short Latin sentences for sentence exercises, each with one construction
# and its German renderings. The shape is documented in SCHEMA.md
# ("Sentence corpus"); test/sentence_corpus_test.dart checks every token
# against the grammar engine and the lessons.
#
# A token is [text, lemma, form key] for a form the engine generates, or
# [text] / [text, headword] for a lesson headword the engine has no item for.

sentences:
  # --- L24: questions with -ne, nōnne, num -----------------------------------
