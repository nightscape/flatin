data_file_id: nouns

axes:
  kasus:
    name: {de: Kasus, en: Case}
    values:
      nom: {de: Nominativ, en: Nominative}
      gen: {de: Genitiv, en: Genitive}
      dat: {de: Dativ, en: Dative}
      akk: {de: Akkusativ, en: Accusative}
      abl: {de: Ablativ, en: Ablative}
      vok: {de: Vokativ, en: Vocative}
  numerus:
    name: {de: Numerus, en: Number}
    values:
      sg: {de: Singular, en: Singular}
      pl: {de: Plural, en: Plural}
  genus:
    name: {de: Genus, en: Gender}
    values:
      m: {de: maskulin, en: masculine}
      f: {de: feminin, en: feminine}
      n: {de: neutrum, en: neuter}
  adverb:
    name: {de: Adverb, en: Adverb}
    values:
      adv: {de: Adverb, en: Adverb}
  grad:
    name: {de: Grad, en: Degree}
    values:
      pos: {de: Positiv, en: Positive}
      komp: {de: Komparativ, en: Comparative}
      sup: {de: Superlativ, en: Superlative}
    hidden_in_label: [pos]

label:
  head: [adverb, grad, genus]
  tail: [kasus, numerus]
  merge_axis: kasus

parts:
  nom:        {label: {de: Nominativ, en: Nominative}}
  gen:        {label: {de: Genitiv, en: Genitive}}
  nom_f:      {label: {de: Nominativ feminin, en: Nominative feminine}}
  nom_n:      {label: {de: Nominativ neutrum, en: Nominative neuter}}
  komparativ: {label: {de: Komparativ, en: Comparative}}
  superlativ: {label: {de: Superlativ, en: Superlative}}

defaults:
  given_part: nom
  lemma_part: nom

type_inference:
  nom:
    - {suffix: "us", min_length: 3, types: [O-Deklination-maskulinum]}
    - {suffix: "um", min_length: 3, types: [O-Deklination-neutrum]}
    - {suffix: "a", min_length: 2, types: [A-Deklination]}
    - {suffix: "iēs", min_length: 3, types: [E-Deklination]}
    - {suffix: "ēs", min_length: 3, types: [E-Deklination-Konsonantstamm]}

classes: [deklination, adjektiv, pronomen, numerale]

types:
  # Ending tables. Leaf types (no delegate, no compose, S14); the verb file
  # delegates its participles to them.
  a-o-Endungen:
    abstract: true
    forms:
      nom.sg.m: "{stamm}us"
      gen.sg.m: "{stamm}ī"
      dat.sg.m: "{stamm}ō"
      akk.sg.m: "{stamm}um"
      abl.sg.m: "{stamm}ō"
      vok.sg.m: "{stamm}e"
      nom.pl.m: "{stamm}ī"
      gen.pl.m: "{stamm}ōrum"
      dat.pl.m: "{stamm}īs"
      akk.pl.m: "{stamm}ōs"
      abl.pl.m: "{stamm}īs"
      vok.pl.m: "{stamm}ī"
      nom.sg.f: "{stamm}a"
      gen.sg.f: "{stamm}ae"
      dat.sg.f: "{stamm}ae"
      akk.sg.f: "{stamm}am"
      abl.sg.f: "{stamm}ā"
      vok.sg.f: "{stamm}a"
      nom.pl.f: "{stamm}ae"
      gen.pl.f: "{stamm}ārum"
      dat.pl.f: "{stamm}īs"
      akk.pl.f: "{stamm}ās"
      abl.pl.f: "{stamm}īs"
      vok.pl.f: "{stamm}ae"
      nom.sg.n: "{stamm}um"
      gen.sg.n: "{stamm}ī"
      dat.sg.n: "{stamm}ō"
      akk.sg.n: "{stamm}um"
      abl.sg.n: "{stamm}ō"
      vok.sg.n: "{stamm}um"
      nom.pl.n: "{stamm}a"
      gen.pl.n: "{stamm}ōrum"
      dat.pl.n: "{stamm}īs"
      akk.pl.n: "{stamm}a"
      abl.pl.n: "{stamm}īs"
      vok.pl.n: "{stamm}a"

  a-o-er-Endungen:
    abstract: true
    inherits_from: a-o-Endungen
    forms:
      nom.sg.m: "{nom_m}"
      vok.sg.m: "{nom_m}"

  Komparativ-Endungen:
    abstract: true
    forms:
      nom.sg.m: "{kstamm}or"
      gen.sg.m: "{kstamm}ōris"
      dat.sg.m: "{kstamm}ōrī"
      akk.sg.m: "{kstamm}ōrem"
      abl.sg.m: "{kstamm}ōre"
      vok.sg.m: "{kstamm}or"
      nom.pl.m: "{kstamm}ōrēs"
      gen.pl.m: "{kstamm}ōrum"
      dat.pl.m: "{kstamm}ōribus"
      akk.pl.m: "{kstamm}ōrēs"
      abl.pl.m: "{kstamm}ōribus"
      vok.pl.m: "{kstamm}ōrēs"
      nom.sg.f: "{kstamm}or"
      gen.sg.f: "{kstamm}ōris"
      dat.sg.f: "{kstamm}ōrī"
      akk.sg.f: "{kstamm}ōrem"
      abl.sg.f: "{kstamm}ōre"
      vok.sg.f: "{kstamm}or"
      nom.pl.f: "{kstamm}ōrēs"
      gen.pl.f: "{kstamm}ōrum"
      dat.pl.f: "{kstamm}ōribus"
      akk.pl.f: "{kstamm}ōrēs"
      abl.pl.f: "{kstamm}ōribus"
      vok.pl.f: "{kstamm}ōrēs"
      nom.sg.n: "{kstamm}us"
      gen.sg.n: "{kstamm}ōris"
      dat.sg.n: "{kstamm}ōrī"
      akk.sg.n: "{kstamm}us"
      abl.sg.n: "{kstamm}ōre"
      vok.sg.n: "{kstamm}us"
      nom.pl.n: "{kstamm}ōra"
      gen.pl.n: "{kstamm}ōrum"
      dat.pl.n: "{kstamm}ōribus"
      akk.pl.n: "{kstamm}ōra"
      abl.pl.n: "{kstamm}ōribus"
      vok.pl.n: "{kstamm}ōra"
      adv: "{kstamm}us"

  3-Endungen:
    abstract: true
    forms:
      nom.sg.m: "{nom_m}"
      gen.sg.m: "{stamm}is"
      dat.sg.m: "{stamm}ī"
      akk.sg.m: "{stamm}em"
      abl.sg.m: "{stamm}ī"
      vok.sg.m: "{nom_m}"
      nom.pl.m: "{stamm}ēs"
      gen.pl.m: "{stamm}ium"
      dat.pl.m: "{stamm}ibus"
      akk.pl.m: ["{stamm}ēs", "{stamm}īs"]
      abl.pl.m: "{stamm}ibus"
      vok.pl.m: "{stamm}ēs"
      nom.sg.f: "{nom_f}"
      gen.sg.f: "{stamm}is"
      dat.sg.f: "{stamm}ī"
      akk.sg.f: "{stamm}em"
      abl.sg.f: "{stamm}ī"
      vok.sg.f: "{nom_f}"
      nom.pl.f: "{stamm}ēs"
      gen.pl.f: "{stamm}ium"
      dat.pl.f: "{stamm}ibus"
      akk.pl.f: ["{stamm}ēs", "{stamm}īs"]
      abl.pl.f: "{stamm}ibus"
      vok.pl.f: "{stamm}ēs"
      nom.sg.n: "{nom_n}"
      gen.sg.n: "{stamm}is"
      dat.sg.n: "{stamm}ī"
      akk.sg.n: "{nom_n}"
      abl.sg.n: "{stamm}ī"
      vok.sg.n: "{nom_n}"
      nom.pl.n: "{stamm}ia"
      gen.pl.n: "{stamm}ium"
      dat.pl.n: "{stamm}ibus"
      akk.pl.n: "{stamm}ia"
      abl.pl.n: "{stamm}ibus"
      vok.pl.n: "{stamm}ia"

  Konsonantstamm-Endungen:
    abstract: true
    forms:
      nom.sg.m: "{nom_m}"
      gen.sg.m: "{stamm}is"
      dat.sg.m: "{stamm}ī"
      akk.sg.m: "{stamm}em"
      abl.sg.m: "{stamm}e"
      vok.sg.m: "{nom_m}"
      nom.pl.m: "{stamm}ēs"
      gen.pl.m: "{stamm}um"
      dat.pl.m: "{stamm}ibus"
      akk.pl.m: "{stamm}ēs"
      abl.pl.m: "{stamm}ibus"
      vok.pl.m: "{stamm}ēs"
      nom.sg.f: "{nom_m}"
      gen.sg.f: "{stamm}is"
      dat.sg.f: "{stamm}ī"
      akk.sg.f: "{stamm}em"
      abl.sg.f: "{stamm}e"
      vok.sg.f: "{nom_m}"
      nom.pl.f: "{stamm}ēs"
      gen.pl.f: "{stamm}um"
      dat.pl.f: "{stamm}ibus"
      akk.pl.f: "{stamm}ēs"
      abl.pl.f: "{stamm}ibus"
      vok.pl.f: "{stamm}ēs"
      nom.sg.n: "{nom_m}"
      gen.sg.n: "{stamm}is"
      dat.sg.n: "{stamm}ī"
      akk.sg.n: "{nom_m}"
      abl.sg.n: "{stamm}e"
      vok.sg.n: "{nom_m}"
      nom.pl.n: "{stamm}a"
      gen.pl.n: "{stamm}um"
      dat.pl.n: "{stamm}ibus"
      akk.pl.n: "{stamm}a"
      abl.pl.n: "{stamm}ibus"
      vok.pl.n: "{stamm}a"

  3-Endungen-Partizip:
    abstract: true
    inherits_from: 3-Endungen
    forms:
      abl.sg.m: ["{stamm}e", "{stamm}ī"]
      abl.sg.f: ["{stamm}e", "{stamm}ī"]
      abl.sg.n: ["{stamm}e", "{stamm}ī"]
      akk.pl.m: "{stamm}ēs"
      akk.pl.f: "{stamm}ēs"

  # Declensions. One gender per type, so their keys carry no genus.
  O-Deklination-maskulinum:
    class: deklination
    display: {de: O-Deklination-maskulinum, en: "2nd declension, masculine"}
    stems:
      stamm: {from: nom, remove: "us", display: {de: Stamm, en: Stem}}
    forms:
      nom.sg: "{stamm}us"
      gen.sg: "{stamm}ī"
      dat.sg: "{stamm}ō"
      akk.sg: "{stamm}um"
      abl.sg: "{stamm}ō"
      vok.sg: "{stamm}e"
      nom.pl: "{stamm}ī"
      gen.pl: "{stamm}ōrum"
      dat.pl: "{stamm}īs"
      akk.pl: "{stamm}ōs"
      abl.pl: "{stamm}īs"
      vok.pl: "{stamm}ī"

  O-Deklination-neutrum:
    class: deklination
    display: {de: O-Deklination-neutrum, en: "2nd declension, neuter"}
    stems:
      stamm: {from: nom, remove: "um", display: {de: Stamm, en: Stem}}
    forms:
      nom.sg: "{stamm}um"
      gen.sg: "{stamm}ī"
      dat.sg: "{stamm}ō"
      akk.sg: "{stamm}um"
      abl.sg: "{stamm}ō"
      vok.sg: "{stamm}um"
      nom.pl: "{stamm}a"
      gen.pl: "{stamm}ōrum"
      dat.pl: "{stamm}īs"
      akk.pl: "{stamm}a"
      abl.pl: "{stamm}īs"
      vok.pl: "{stamm}a"

  A-Deklination:
    class: deklination
    display: {de: A-Deklination, en: "1st declension"}
    stems:
      stamm: {from: nom, remove: "a", display: {de: Stamm, en: Stem}}
    forms:
      nom.sg: "{stamm}a"
      gen.sg: "{stamm}ae"
      dat.sg: "{stamm}ae"
      akk.sg: "{stamm}am"
      abl.sg: "{stamm}ā"
      vok.sg: "{stamm}a"
      nom.pl: "{stamm}ae"
      gen.pl: "{stamm}ārum"
      dat.pl: "{stamm}īs"
      akk.pl: "{stamm}ās"
      abl.pl: "{stamm}īs"
      vok.pl: "{stamm}ae"

  E-Deklination:
    class: deklination
    display: {de: E-Deklination, en: "5th declension"}
    stems:
      stamm: {from: nom, remove: "ēs", display: {de: Stamm, en: Stem}}
    forms:
      nom.sg: "{stamm}ēs"
      gen.sg: "{stamm}ēī"
      dat.sg: "{stamm}ēī"
      akk.sg: "{stamm}em"
      abl.sg: "{stamm}ē"
      vok.sg: "{stamm}ēs"
      nom.pl: "{stamm}ēs"
      gen.pl: "{stamm}ērum"
      dat.pl: "{stamm}ēbus"
      akk.pl: "{stamm}ēs"
      abl.pl: "{stamm}ēbus"
      vok.pl: "{stamm}ēs"

  E-Deklination-Konsonantstamm:
    class: deklination
    display: {de: E-Deklination-Konsonantstamm, en: "5th declension, consonant stem"}
    inherits_from: E-Deklination
    forms:
      gen.sg: "{stamm}eī"
      dat.sg: "{stamm}eī"

  U-Deklination:
    class: deklination
    display: {de: U-Deklination, en: "4th declension"}
    stems:
      stamm: {from: nom, remove: "us", display: {de: Stamm, en: Stem}}
    forms:
      nom.sg: "{stamm}us"
      gen.sg: "{stamm}ūs"
      dat.sg: "{stamm}uī"
      akk.sg: "{stamm}um"
      abl.sg: "{stamm}ū"
      vok.sg: "{stamm}us"
      nom.pl: "{stamm}ūs"
      gen.pl: "{stamm}uum"
      dat.pl: "{stamm}ibus"
      akk.pl: "{stamm}ūs"
      abl.pl: "{stamm}ibus"
      vok.pl: "{stamm}ūs"

  Konsonantische-Deklination-mf:
    class: deklination
    display: {de: Konsonantische-Deklination-mf, en: "3rd declension, consonant stem, m/f"}
    stems:
      stamm:  {from: gen, remove: "is", display: {de: Stamm, en: Stem}}
      nom_sg: {from: nom, remove: "", display: {de: Nominativ, en: Nominative}}
    forms:
      nom.sg: "{nom_sg}"
      gen.sg: "{stamm}is"
      dat.sg: "{stamm}ī"
      akk.sg: "{stamm}em"
      abl.sg: "{stamm}e"
      vok.sg: "{nom_sg}"
      nom.pl: "{stamm}ēs"
      gen.pl: "{stamm}um"
      dat.pl: "{stamm}ibus"
      akk.pl: "{stamm}ēs"
      abl.pl: "{stamm}ibus"
      vok.pl: "{stamm}ēs"

  Konsonantische-Deklination-n:
    class: deklination
    display: {de: Konsonantische-Deklination-n, en: "3rd declension, consonant stem, neuter"}
    stems:
      stamm:  {from: gen, remove: "is", display: {de: Stamm, en: Stem}}
      nom_sg: {from: nom, remove: "", display: {de: Nominativ, en: Nominative}}
    forms:
      nom.sg: "{nom_sg}"
      gen.sg: "{stamm}is"
      dat.sg: "{stamm}ī"
      akk.sg: "{nom_sg}"
      abl.sg: "{stamm}e"
      vok.sg: "{nom_sg}"
      nom.pl: "{stamm}a"
      gen.pl: "{stamm}um"
      dat.pl: "{stamm}ibus"
      akk.pl: "{stamm}a"
      abl.pl: "{stamm}ibus"
      vok.pl: "{stamm}a"

  Konsonantische-Deklination-i-mf:
    class: deklination
    display: {de: Konsonantische-Deklination-i-mf, en: "3rd declension, i-stem, m/f"}
    inherits_from: Konsonantische-Deklination-mf
    forms:
      gen.pl: "{stamm}ium"

  Konsonantische-Deklination-i-n:
    class: deklination
    display: {de: Konsonantische-Deklination-i-n, en: "3rd declension, i-stem, neuter"}
    inherits_from: Konsonantische-Deklination-n
    forms:
      abl.sg: "{stamm}ī"
      nom.pl: "{stamm}ia"
      gen.pl: "{stamm}ium"
      akk.pl: "{stamm}ia"
      vok.pl: "{stamm}ia"

  # Adjectives. Every grade is a delegate into an ending table, so the three
  # grades share one key space and the adverb sits beside them.
  Adjektiv-a-o:
    class: adjektiv
    display: {de: Adjektiv-a-o, en: "adjective, 1st/2nd declension"}
    stems:
      stamm:  {from: nom, remove: "us", display: {de: Stamm, en: Stem}}
      kstamm: {from: komparativ, remove: "or", default: "{stamm}i", display: {de: Komparativstamm, en: Comparative stem}}
      sup:    {from: superlativ, remove: "us", default: "{stamm}issim", display: {de: Superlativstamm, en: Superlative stem}}
    delegate:
      - {name: pos,  type: a-o-Endungen, bind: {stamm: stamm}, set: {grad: pos}}
      - {name: komp, type: Komparativ-Endungen, bind: {kstamm: kstamm}, set: {grad: komp}}
      - {name: sup,  type: a-o-Endungen, bind: {stamm: sup}, set: {grad: sup}}
    forms:
      adv.pos: "{stamm}ē"
      adv.sup: "{sup}ē"

  Adjektiv-a-o-er:
    class: adjektiv
    display: {de: Adjektiv-a-o-er, en: "adjective, 1st/2nd declension in -er"}
    inherits_from: Adjektiv-a-o
    stems:
      stamm: {from: nom_f, remove: "a", display: {de: Stamm, en: Stem}}
      nom_m: {from: nom, remove: "", display: {de: Nominativ, en: Nominative}}
      sup:   {from: superlativ, remove: "us", default: "{nom_m}rim", display: {de: Superlativstamm, en: Superlative stem}}
    delegate:
      - {name: pos, type: a-o-er-Endungen, bind: {stamm: stamm, nom_m: nom_m}, set: {grad: pos}}

  Adjektiv-3:
    abstract: true
    stems:
      kstamm: {from: komparativ, remove: "or", default: "{stamm}i", display: {de: Komparativstamm, en: Comparative stem}}
      sup:    {from: superlativ, remove: "us", default: "{stamm}issim", display: {de: Superlativstamm, en: Superlative stem}}
    delegate:
      - {name: pos,  type: 3-Endungen, bind: {stamm: stamm, nom_m: nom_m, nom_f: nom_f, nom_n: nom_n}, set: {grad: pos}}
      - {name: komp, type: Komparativ-Endungen, bind: {kstamm: kstamm}, set: {grad: komp}}
      - {name: sup,  type: a-o-Endungen, bind: {stamm: sup}, set: {grad: sup}}
    forms:
      adv.pos: "{stamm}iter"
      adv.sup: "{sup}ē"

  Adjektiv-zweiendig:
    class: adjektiv
    display: {de: Adjektiv-zweiendig, en: "adjective, 3rd declension, two endings"}
    inherits_from: Adjektiv-3
    stems:
      stamm: {from: nom, remove: "is", display: {de: Stamm, en: Stem}}
      nom_m: {from: nom, remove: "", display: {de: Nominativ, en: Nominative}}
      nom_f: {template: "{nom_m}", display: {de: Nominativ, en: Nominative}}
      nom_n: {from: nom_n, remove: "", display: {de: Nominativ neutrum, en: Nominative neuter}}

  Adjektiv-dreiendig:
    class: adjektiv
    display: {de: Adjektiv-dreiendig, en: "adjective, 3rd declension, three endings"}
    inherits_from: Adjektiv-3
    stems:
      stamm: {from: nom_f, remove: "is", display: {de: Stamm, en: Stem}}
      nom_m: {from: nom, remove: "", display: {de: Nominativ, en: Nominative}}
      nom_f: {from: nom_f, remove: "", display: {de: Nominativ feminin, en: Nominative feminine}}
      nom_n: {from: nom_n, remove: "", display: {de: Nominativ neutrum, en: Nominative neuter}}
      sup:   {from: superlativ, remove: "us", default: "{nom_m}rim", display: {de: Superlativstamm, en: Superlative stem}}

  Adjektiv-einendig-i:
    class: adjektiv
    display: {de: Adjektiv-einendig-i, en: "adjective, 3rd declension, one ending, i-stem"}
    inherits_from: Adjektiv-3
    stems:
      stamm: {from: gen, remove: "is", display: {de: Stamm, en: Stem}}
      nom_m: {from: nom, remove: "", display: {de: Nominativ, en: Nominative}}
      nom_f: {template: "{nom_m}", display: {de: Nominativ, en: Nominative}}
      nom_n: {template: "{nom_m}", display: {de: Nominativ, en: Nominative}}

  Adjektiv-einendig-Konsonantstamm:
    class: adjektiv
    display: {de: Adjektiv-einendig-Konsonantstamm, en: "adjective, 3rd declension, one ending, consonant stem"}
    stems:
      stamm:  {from: gen, remove: "is", display: {de: Stamm, en: Stem}}
      nom_m:  {from: nom, remove: "", display: {de: Nominativ, en: Nominative}}
      kstamm: {from: komparativ, remove: "or", default: "{stamm}i", display: {de: Komparativstamm, en: Comparative stem}}
      sup:    {from: superlativ, remove: "us", default: "{stamm}issim", display: {de: Superlativstamm, en: Superlative stem}}
    delegate:
      - {name: pos,  type: Konsonantstamm-Endungen, bind: {stamm: stamm, nom_m: nom_m}, set: {grad: pos}}
      - {name: komp, type: Komparativ-Endungen, bind: {kstamm: kstamm}, set: {grad: komp}}
      - {name: sup,  type: a-o-Endungen, bind: {stamm: sup}, set: {grad: sup}}

  # Pronouns and numerals: one type per lexeme, every form on the item.
  Pronomen-personal:
    class: pronomen
    display: {de: Pronomen-personal, en: personal pronoun}
  Pronomen-is:
    class: pronomen
    display: {de: Pronomen-is, en: "pronoun is, ea, id"}
  Pronomen-idem:
    class: pronomen
    display: {de: Pronomen-idem, en: "pronoun īdem, eadem, idem"}
  Pronomen-hic:
    class: pronomen
    display: {de: Pronomen-hic, en: "pronoun hic, haec, hoc"}
  Pronomen-ille:
    class: pronomen
    display: {de: Pronomen-ille, en: "pronoun ille, illa, illud"}
  Pronomen-iste:
    class: pronomen
    display: {de: Pronomen-iste, en: "pronoun iste, ista, istud"}
  Pronomen-ipse:
    class: pronomen
    display: {de: Pronomen-ipse, en: "pronoun ipse, ipsa, ipsum"}
  Pronomen-qui:
    class: pronomen
    display: {de: Pronomen-qui, en: "pronoun quī, quae, quod"}
  Pronomen-quis:
    class: pronomen
    display: {de: Pronomen-quis, en: "pronoun quis, quid"}
  Numerale-unus:
    class: numerale
    display: {de: Numerale-unus, en: numeral ūnus}
  Numerale-duo:
    class: numerale
    display: {de: Numerale-duo, en: numeral duo}
  Numerale-tres:
    class: numerale
    display: {de: Numerale-tres, en: numeral trēs}
  Numerale-milia:
    class: numerale
    display: {de: Numerale-milia, en: numeral mīlia}

# Anchors that items alias. They sit above `items:` because a YAML alias only
# resolves below its anchor. The loader ignores this block.
shared:
  ohne_steigerung: &ohne_steigerung [{grad: komp}, {grad: sup}, {adverb: adv}]
